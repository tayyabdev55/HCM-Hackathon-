<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · HCM Lite</title><link rel="stylesheet" href="../css/style.css"></head><body><div id="app"></div>
<script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/attendance.js"></script><script src="../js/leave.js"></script><script src="../js/helper.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const user=HCM.guard('admin');if(user){HCM.wireTheme();const company=HCM.company(),users=HCM.users().filter(u=>u.role==='employee'),records=HCM.attendance(),leaves=HCM.leaves(),today=HCM.today(),todayRecs=records.filter(a=>a.date===today),pending=leaves.filter(l=>l.status==='Pending');
const nav=[['admin.html','▦','Dashboard'],['employees.html','♙','Employees'],['attendance.html','◷','Attendance'],['leaves.html','▤','Leave requests'],['settings.html','⚙','Settings'],['payslip.html','＄','Payslips']];
document.querySelector('#app').innerHTML=`<div class="app-layout"><aside class="sidebar"><div class="brand-mark">HCM<span>+</span></div><div><div class="nav-label">WORKSPACE</div><nav class="nav-links">${nav.map(n=>`<a class="${n[0]==='admin.html'?'active':''}" href="${n[0]}"><span>${n[1]}</span>${n[2]}</a>`).join('')}</nav></div><div class="sidebar-bottom"><div class="user-chip"><strong>${HCM.esc(user.name)}</strong><span class="muted">Administrator</span></div><button class="btn secondary" data-theme-toggle>☼ Toggle theme</button><button class="btn secondary" id="logout">↗ Sign out</button></div></aside><header class="mobile-top"><span class="brand-mark">HCM<span>+</span></span><nav class="nav-links">${nav.map(n=>`<a href="${n[0]}">${n[2]}</a>`).join('')}</nav></header><main class="main-area"><header class="page-header"><div><p class="eyebrow">OVERVIEW · ${HCM.esc(today)}</p><h2>Good day, ${HCM.esc(user.name.split(' ')[0])} 👋</h2><p>Here’s what’s happening at ${HCM.esc(company.name||'your company')}.</p></div><div class="header-actions"><button class="btn secondary" id="exportCsv">Export attendance CSV</button><button class="btn primary" onclick="location.href='employees.html'">+ Add employee</button></div></header>
<div class="grid stats-grid"><article class="panel stat"><div class="stat-label">Total employees</div><div class="stat-value">${users.length}</div><div class="stat-note"><span class="accent-dot"></span>Employee accounts</div></article><article class="panel stat"><div class="stat-label">Checked in today</div><div class="stat-value">${todayRecs.length}</div><div class="stat-note">Of ${users.length} employees</div></article><article class="panel stat"><div class="stat-label">Late today</div><div class="stat-value">${todayRecs.filter(a=>a.status==='Late').length}</div><div class="stat-note">Beyond grace period</div></article><article class="panel stat"><div class="stat-label">Pending leaves</div><div class="stat-value">${pending.length}</div><div class="stat-note"><a href="leaves.html">Review requests →</a></div></article></div>
<div class="grid two-col"><section class="panel"><div class="panel-head"><div><h3>Today’s attendance</h3><p>Live records from this browser</p></div><button class="btn secondary small" onclick="location.href='employees.html'">Employees</button></div><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Department</th><th>In</th><th>Out</th><th>Status</th></tr></thead><tbody>${todayRecs.length?todayRecs.map(a=>{const u=users.find(x=>x.id===a.employeeId)||{};return `<tr><td>${HCM.esc(u.name||'Deleted')}</td><td>${HCM.esc(u.department||'—')}</td><td>${a.checkIn||'—'}</td><td>${a.checkOut||'—'}</td><td><span class="badge ${HCM.statusClass(a.status)}">${HCM.esc(a.status)}</span></td></tr>`}).join(''):`<tr><td colspan="5" class="empty">No check-ins recorded today.</td></tr>`}</tbody></table></div></section>
<section class="panel"><div class="panel-head"><div><h3>Attendance snapshot</h3><p>Today’s recorded statuses</p></div></div><canvas id="attendanceChart" class="chart-canvas" aria-label="Attendance status chart"></canvas><div class="notice" style="margin-top:15px"><strong>Smart Helper</strong><br>Open the chat bubble to ask about headcount, late arrivals, leave and more.</div></section>
<section class="panel"><div class="panel-head"><div><h3>Pending leave requests</h3><p>Needs your attention</p></div><a href="leaves.html">View all →</a></div>${pending.length?pending.slice(0,5).map(l=>`<div class="announcement"><strong>${HCM.esc((users.find(u=>u.id===l.employeeId)||{}).name||'Employee')}</strong><div class="muted">${HCM.esc(l.type)} · ${HCM.fmtDate(l.from)} – ${HCM.fmtDate(l.to)} · ${l.days} working day(s)</div></div>`).join(''):'<div class="empty">You’re all caught up.</div>'}</section>
<section class="panel"><div class="panel-head"><div><h3>Quick actions</h3><p>Common HR tasks</p></div></div><div class="split"><a class="quick-action" href="employees.html"><strong>＋ Add a teammate</strong><span>Create employee login credentials</span></a><a class="quick-action" href="settings.html"><strong>⚙ Company rules</strong><span>Configure time and leave quota</span></a><a class="quick-action" href="leaves.html"><strong>▤ Review leave</strong><span>Approve or reject requests</span></a><a class="quick-action" href="payslip.html"><strong>＄ Payslips</strong><span>Monthly payroll calculation</span></a></div></section></div></main></div>`;
document.querySelector('#logout').onclick=HCM.logout;document.querySelector('#exportCsv').onclick=()=>HCMAttendance.exportCSV(records,`attendance-${today}.csv`);HCMHelper.mount(user);
if(window.Chart)new Chart(document.querySelector('#attendanceChart'),{type:'doughnut',data:{labels:['Present','Late','Half day'],datasets:[{data:[todayRecs.filter(a=>a.status==='Present').length,todayRecs.filter(a=>a.status==='Late').length,todayRecs.filter(a=>a.status==='Half Day').length],backgroundColor:['#34d399','#fbbf24','#fb7185'],borderWidth:0}]},options:{plugins:{legend:{labels:{color:getComputedStyle(document.body).color}}},maintainAspectRatio:true}});
}
</script></body></html>
