<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Payslip · HCM Lite</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div id="app"></div>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        const user = HCM.guard(null); if (user) {
            HCM.wireTheme(); const admin = user.role === 'admin', nav = admin ? [['admin.html', 'Dashboard'], ['employees.html', 'Employees'], ['attendance.html', 'Attendance'], ['leaves.html', 'Leave requests'], ['settings.html', 'Settings'], ['payslip.html', 'Payslips']] : [['employee.html', 'My dashboard'], ['attendance.html', 'Attendance'], ['payslip.html', 'My payslip']]; document.querySelector('#app').innerHTML = `<div class="app-layout"><aside class="sidebar"><div class="brand-mark">HCM<span>+</span></div><nav class="nav-links">${nav.map(n => `<a class="${n[0] === 'payslip.html' ? 'active' : ''}" href="${n[0]}">${n[1]}</a>`).join('')}</nav><div class="sidebar-bottom"><div class="user-chip"><strong>${HCM.esc(user.name)}</strong><span class="muted">${admin ? 'Administrator' : 'Employee'}</span></div><button class="btn secondary" data-theme-toggle>☼ Toggle theme</button><button class="btn secondary" id="logout">↗ Sign out</button></div></aside><header class="mobile-top"><span class="brand-mark">HCM<span>+</span></span><nav class="nav-links">${nav.map(n => `<a href="${n[0]}">${n[1]}</a>`).join('')}</nav></header><main class="main-area"><header class="page-header no-print"><div><p class="eyebrow">PAYROLL</p><h2>Monthly payslip</h2><p>Deduction = daily rate × (absent days + 0.5 × half days).</p></div><div class="header-actions"><label class="field">Month<input id="month" type="month" value="${HCM.today().slice(0, 7)}"></label><button class="btn primary" id="print">Print / Save PDF</button></div></header><div class="payslip" id="slip"></div></main></div>`;
            function render() {
                const month = document.querySelector('#month').value || HCM.today().slice(0, 7), [year, mo] = month.split('-').map(Number), all = HCM.users().filter(u => u.role === 'employee'), people = admin ? all : all.filter(u => u.id === user.id), records = HCM.attendance().filter(a => a.date.startsWith(month)), company = HCM.company(), working = HCM.monthWorkingDays(year, mo, company.workingDays), slip = document.querySelector('#slip'); let rows = '', totalGross = 0, totalDed = 0, totalNet = 0;
                people.forEach(u => { const mine = records.filter(a => a.employeeId === u.id), absent = Math.max(0, working - new Set(mine.map(a => a.date)).size), half = mine.filter(a => a.status === 'Half Day').length, dayRate = working ? Number(u.salary) / working : 0, deduction = dayRate * (absent + 0.5 * half), net = Number(u.salary) - deduction; totalGross += Number(u.salary); totalDed += deduction; totalNet += net; rows += `<tr><td>${HCM.esc(u.name)}</td><td>${working}</td><td>${absent}</td><td>${half}</td><td>${dayRate.toLocaleString(undefined, { maximumFractionDigits: 2 })}</td><td>${deduction.toLocaleString(undefined, { maximumFractionDigits: 2 })}</td><td><strong>${net.toLocaleString(undefined, { maximumFractionDigits: 2 })}</strong></td></tr>`; });
                slip.innerHTML = `<div style="display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;border-bottom:2px solid #06b6d4;padding-bottom:20px;margin-bottom:25px"><div><p style="color:#0891b2;font-size:.75rem;letter-spacing:.14em;font-weight:700">PAYROLL STATEMENT</p><h1>${HCM.esc(company.name || 'HCM Lite')}</h1><p class="muted">${admin ? 'Company monthly payroll' : 'Employee salary statement'}</p></div><div style="text-align:right"><h2>${new Date(year, mo - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</h2><p class="muted">Generated ${HCM.fmtDate(HCM.today())}</p></div></div><div class="notice" style="color:#334155;background:#f0f9ff;border-color:#bae6fd;margin-bottom:20px"><strong>Calculation policy</strong><br>Daily rate = monthly salary ÷ ${working} working days. Deduction = daily rate × (absent days + 0.5 × half days). A date without an attendance record is counted absent for this calculation.</div><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Working days</th><th>Absent</th><th>Half days</th><th>Daily rate</th><th>Deduction</th><th>Net salary</th></tr></thead><tbody>${rows || '<tr><td colspan="7" class="empty">No employee accounts found.</td></tr>'}</tbody></table></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:25px"><div style="padding:15px;background:#f1f5f9;border-radius:10px"><small>Total gross</small><h2>${totalGross.toLocaleString(undefined, { maximumFractionDigits: 2 })}</h2></div><div style="padding:15px;background:#fff1f2;border-radius:10px"><small>Total deductions</small><h2>${totalDed.toLocaleString(undefined, { maximumFractionDigits: 2 })}</h2></div><div style="padding:15px;background:#ecfdf5;border-radius:10px"><small>Total net</small><h2>${totalNet.toLocaleString(undefined, { maximumFractionDigits: 2 })}</h2></div></div><p class="muted" style="margin-top:28px;font-size:.78rem">HCM Lite · Local browser-generated statement. Review attendance records before processing real payroll.</p>`;
            }
            document.querySelector('#month').onchange = render; document.querySelector('#print').onclick = () => window.print(); document.querySelector('#logout').onclick = HCM.logout; render();
        }
    </script>
</body>

</html>
