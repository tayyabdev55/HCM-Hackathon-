<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCM Lite - My attendance</title>
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <header class="topbar">
      <div><h1>My attendance</h1><p>Every working day of the month.</p></div>
      <div class="admin-profile">
        <div class="avatar" id="avatar">HR</div>
        <div><strong id="adminName"></strong><small id="roleLabel"></small></div>
      </div>
    </header>
    <section class="stats-grid">
      <div class="stat-card"><span>✅</span><p>On time</p><h2 id="s-present">0</h2></div>
      <div class="stat-card"><span>⏰</span><p>Late</p><h2 id="s-late">0</h2></div>
      <div class="stat-card"><span>🌗</span><p>Half day</p><h2 id="s-half">0</h2></div>
      <div class="stat-card"><span>🌴</span><p>Leave</p><h2 id="s-leave">0</h2></div>
      <div class="stat-card"><span>🚫</span><p>Absent</p><h2 id="s-absent">0</h2></div>
    </section>
    <section class="content-card"><h2>Records</h2><p>Pick a month to see your history.</p>
      <div class="toolbar"><input id="monthPicker" type="month"></div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>In</th><th>Out</th><th>Hours</th><th>Status</th></tr></thead><tbody id="attBody"></tbody></table></div>
    </section>
    <footer>HCM Lite © 2026</footer>
  </main>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/attendance.js"></script>
</body>
</html>
