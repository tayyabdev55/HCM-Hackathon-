<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCM Lite - My leaves</title>
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <header class="topbar">
      <div><h1>My leaves</h1><p>Apply for leave and follow the status.</p></div>
      <div class="admin-profile">
        <div class="avatar" id="avatar">HR</div>
        <div><strong id="adminName"></strong><small id="roleLabel"></small></div>
      </div>
    </header>
    <section class="content-card"><h2>Apply for leave</h2><p>Weekends are not counted. You cannot go over your yearly quota.</p>
      <form id="leaveForm" class="form-grid" novalidate>
        <div class="field"><label for="leaveType">Type</label><select id="leaveType"><option>Casual</option><option>Sick</option><option>Annual</option></select></div>
        <div class="field"><label for="leaveReason">Reason</label><input id="leaveReason" type="text" placeholder="Short reason"></div>
        <div class="field"><label for="leaveFrom">From</label><input id="leaveFrom" type="date"></div>
        <div class="field"><label for="leaveTo">To</label><input id="leaveTo" type="date"></div>
        <div class="field full"><button class="primary-btn" type="submit">Send request</button><p id="leaveMessage" role="status"></p></div>
      </form>
    </section>
    <section class="content-card"><h2>My requests</h2><p>Status and your Admin's comment.</p>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th>Comment</th></tr></thead><tbody id="myLeavesBody"></tbody></table></div>
    </section>
    <footer>HCM Lite © 2026</footer>
  </main>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/leave.js"></script>
</body>
</html>
