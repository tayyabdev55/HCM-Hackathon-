<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCM Lite - Profile</title>
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <header class="topbar">
      <div><h1>My profile</h1><p>Your details and password.</p></div>
      <div class="admin-profile">
        <div class="avatar" id="avatar">HR</div>
        <div><strong id="adminName"></strong><small id="roleLabel"></small></div>
      </div>
    </header>
    <div class="grid-2">
      <section class="content-card"><h2>Details</h2><p>Ask the Admin to change these.</p>
        <dl class="details"><dt>Name</dt><dd id="pName"></dd><dt>Email</dt><dd id="pEmail"></dd><dt>Role</dt><dd id="pRole"></dd><dt>Department</dt><dd id="pDept"></dd></dl>
      </section>
      <section class="content-card"><h2>Change password</h2><p>Use at least 6 characters.</p>
        <form id="passwordForm" novalidate>
          <div class="field"><label for="curPw">Current password</label><input id="curPw" type="password"></div>
          <div class="field"><label for="newPw">New password</label><input id="newPw" type="password"></div>
          <div class="field"><label for="confirmPw">Confirm new password</label><input id="confirmPw" type="password"></div>
          <button class="primary-btn" type="submit">Update password</button><p id="pwMessage" role="status"></p>
        </form>
      </section>
    </div>
    <footer>HCM Lite © 2026</footer>
  </main>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
