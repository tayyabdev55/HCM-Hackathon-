<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCM Lite - Settings</title>
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <header class="topbar">
      <div><h1>Company settings</h1><p>These rules decide late, half day, leave and payslips.</p></div>
      <div class="admin-profile">
        <div class="avatar" id="avatar">HR</div>
        <div><strong id="adminName"></strong><small id="roleLabel"></small></div>
      </div>
    </header>
    <section class="content-card"><h2>Rules</h2><p>Change anytime. New rules apply from now on.</p>
      <form id="settingsForm" class="form-grid" novalidate>
        <div class="field full"><label for="setName">Company name</label><input id="setName" type="text"></div>
        <div class="field"><label for="setStart">Office start time</label><input id="setStart" type="time"></div>
        <div class="field"><label for="setGrace">Grace minutes</label><input id="setGrace" type="number" min="0"></div>
        <div class="field"><label for="setQuota">Yearly leave quota (days)</label><input id="setQuota" type="number" min="1"></div>
        <div class="field full"><label>Working days</label>
          <div class="days" id="wdBox">
            <label><input type="checkbox" class="wd" value="1"> Mon</label><label><input type="checkbox" class="wd" value="2"> Tue</label>
            <label><input type="checkbox" class="wd" value="3"> Wed</label><label><input type="checkbox" class="wd" value="4"> Thu</label>
            <label><input type="checkbox" class="wd" value="5"> Fri</label><label><input type="checkbox" class="wd" value="6"> Sat</label>
            <label><input type="checkbox" class="wd" value="0"> Sun</label>
          </div></div>
        <div class="field full"><button class="primary-btn" type="submit">Save settings</button><p id="settingsMessage" role="status"></p></div>
      </form>
    </section>
    <footer>HCM Lite © 2026</footer>
  </main>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/settings.js"></script>
</body>
</html>
