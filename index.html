<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCM Lite - Login</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
  <div class="login-card">
    <h1>HCM Lite</h1>
    <p id="subtitle">Human Capital Management System</p>

    <!-- First run: create company + admin -->
    <form id="setupForm" hidden novalidate>
      <label for="companyName">Company name</label>
    <input type="text" id="companyName" placeholder="e.g. Saylani Tech">
      <label for="adminName">Your name</label>
      <input type="text" id="adminName" placeholder="Admin full name">
      <label for="adminEmail">Admin email</label>
      <input type="email" id="adminEmail" placeholder="admin@company.com">
      <label for="adminPassword">Password</label>
      <input type="password" id="adminPassword" placeholder="Minimum 6 characters">
      <label for="startTime">Office start time</label>
      <input type="time" id="startTime" value="09:00">
      <label for="graceMinutes">Grace minutes</label>
      <input type="number" id="graceMinutes" min="0" value="15">
      <label for="leaveQuota">Yearly leave quota (days)</label>
      <input type="number" id="leaveQuota" min="1" value="20">
      <button type="submit">Create company</button>
    </form>

    <form id="loginForm" hidden novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter email" autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
      <button type="submit">Login</button>
    </form>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const user = currentUser();
    if (user) location.href = "pages/" + (user.role === "admin" ? "admin.html" : "employee.html");

    const setupForm = document.getElementById("setupForm"), loginForm = document.getElementById("loginForm");
    const val = id => document.getElementById(id).value.trim();

    if (getCompany()) {
      loginForm.hidden = false;
    } else {
      setupForm.hidden = false;
      document.getElementById("subtitle").textContent = "First time here? Set up your company and Admin account.";
    }

    setupForm.addEventListener("submit", e => {
      e.preventDefault();
      let ok = true;
      ok = setErr("companyName", val("companyName") ? "" : "Company name is required") && ok;
      ok = setErr("adminName", val("adminName") ? "" : "Your name is required") && ok;
      ok = setErr("adminEmail", isEmail(val("adminEmail")) ? "" : "Enter a valid email") && ok;
      ok = setErr("adminPassword", val("adminPassword").length >= 6 ? "" : "At least 6 characters") && ok;
      ok = setErr("startTime", val("startTime") ? "" : "Required") && ok;
      ok = setErr("graceMinutes", val("graceMinutes") !== "" && +val("graceMinutes") >= 0 ? "" : "Enter 0 or more") && ok;
      ok = setErr("leaveQuota", +val("leaveQuota") > 0 ? "" : "Enter a number above 0") && ok;
      if (!ok) return;
      save(KEYS.company, { name: val("companyName"), start: val("startTime"), grace: +val("graceMinutes"), quota: +val("leaveQuota"), workDays: [1, 2, 3, 4, 5] });
      const adminUser = { id: Date.now(), name: val("adminName"), email: val("adminEmail").toLowerCase(), password: val("adminPassword"), role: "admin", department: "Management", salary: 0 };
      save(KEYS.users, [adminUser]);
      save(KEYS.session, { id: adminUser.id });
      location.href = "pages/admin.html";
    });

    loginForm.addEventListener("submit", e => {
      e.preventDefault();
      const found = getUsers().find(u => u.email === val("email").toLowerCase() && u.password === document.getElementById("password").value);
      if (!setErr("password", found ? "" : "Wrong email or password")) return;
      save(KEYS.session, { id: found.id });
      location.href = "pages/" + (found.role === "admin" ? "admin.html" : "employee.html");
    });
  </script>
</body>
</html>
